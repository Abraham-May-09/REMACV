<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sitio en mantenimiento · REMACV</title>
  <link rel="icon" type="image/png" href="/assets/remacv-mark.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      background:
        radial-gradient(1200px 600px at 20% 10%, rgba(63,161,94,.22), transparent 60%),
        radial-gradient(900px 500px at 85% 90%, rgba(31,122,71,.25), transparent 60%),
        #0b1f15;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      text-align: center;
    }
    main { max-width: 560px; }
    img { display: block; width: 96px; height: 96px; margin: 0 auto 28px; }
    .eyebrow {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      font-size: 11px; font-weight: 700; letter-spacing: .26em; text-transform: uppercase;
      color: #9cd3ac;
      margin-bottom: 18px;
    }
    .eyebrow::before, .eyebrow::after {
      content: ''; width: 28px; height: 1px; background: currentColor; opacity: .6;
    }
    h1 {
      font-size: clamp(32px, 6vw, 52px);
      line-height: 1.05;
      letter-spacing: -.03em;
      font-weight: 700;
      margin-bottom: 20px;
    }
    h1 em { font-style: normal; color: #6cc28a; }
    p {
      font-size: 16.5px;
      line-height: 1.65;
      color: rgba(255,255,255,.78);
    }
    .bar {
      width: 140px; height: 3px; margin: 34px auto 0;
      border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden;
    }
    .bar::after {
      content: ''; display: block; width: 40%; height: 100%;
      background: #6cc28a; border-radius: 3px;
      animation: carga 1.8s ease-in-out infinite;
    }
    @keyframes carga { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
    footer {
      margin-top: 40px;
      font-size: 12.5px;
      color: rgba(255,255,255,.5);
      letter-spacing: .02em;
    }
  </style>
</head>
<body>
  <main>
    <img src="/assets/remacv-mark.png" alt="REMACV" />
    <div class="eyebrow">Sitio en mantenimiento</div>
    <h1>Estamos <em>actualizando</em> el sitio.</h1>
    <p>
      La Red Mexicana de Análisis de Ciclo de Vida está renovando su página
      con nuevas secciones e información. Vuelve pronto.
    </p>
    <div class="bar" aria-hidden="true"></div>
    <footer>Red Mexicana de Análisis de Ciclo de Vida A.C.</footer>
  </main>
</body>
</html>
